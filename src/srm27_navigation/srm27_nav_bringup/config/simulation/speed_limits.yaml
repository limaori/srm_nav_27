# =============================================================================
# 仿真速度限幅 —— 唯一来源（single source of truth）
# =============================================================================
#
# 本文件是仿真链上**所有非串口限幅**的唯一定义处。启动时由
#   launch/nav2_stack_launch.py
#   launch/nav_srm_simulation_launch.py
# 合并进下面这几份参数文件，合并后各节点收到的就是这里的值：
#   * config/simulation/nav2_params_srm.yaml         （Omni 变体）
#   * config/simulation/nav2_params_srm_minco.yaml   （MINCO 变体）
#   * srm27_chassis_control/config/srm_chassis_control.yaml （mux 与自转链）
# 那几份文件里**不再写**这些键：如果两处都写、值还不一样，启动会直接报错
# （见 scripts/srm_speed_limits.py 的冲突检查——"两处都在定义"正是要消灭的陷阱）。
#
# 为什么必须放一处
# ----------------
# 导航实际速度 = 链路上所有限幅层的最小值：
#   控制器 FollowPath ─► velocity_smoother ─► srm_cmd_mux ─► 速度适配器 ─► Gazebo
# 少改一层，上游提速就被下游静默吃掉，现场表现就是"改了参数没效果"。
#
# 语法
# ----
#   * 顶层键 = 参数文件里的节点名；`@minco` / `@omni` 后缀表示只对该控制器变体生效，
#     不带 @ 的段对所有变体生效（共用节点）。
#   * 变体由参数文件里的 FollowPath.plugin 判定，不需要在这里声明。
#   * 段内层级与参数文件完全一致（必须带 ros__parameters，否则启动报错）。
#
# 当前档位（2026-10-10，写入时的工作区状态）
# ------------------------------------------
#   | 层                       | Omni 变体 | MINCO 变体 | 说明                     |
#   |--------------------------|-----------|------------|--------------------------|
#   | 控制器平移上限           | 1.50      | 6.00       | 最直接的"油门"           |
#   | 控制器平移加速度上限     | 无        | 10.00      | Omni 由平滑器承担        |
#   | 平滑器 max_velocity      | 1.50      | 5.00       | ⇒ 当前 MINCO 链卡在这一层 |
#   | 平滑器 max_accel         | 3.00      | 6.00       | 短航段跑不满就是这个太小 |
#   | mux v_max（合速度）      | 6.00      | 6.00       | cmd_vel_sim 前最后一道钳位 |
#   ⚠ Omni 变体仍在 1.5 档（A/B 对照与回退配置），MINCO 是当前提速试验档。
#     两个变体要同档时，把下面 MINCO 的 limits.* 也写成 1.5 档的数值即可。
#   ⚠ 6.0 m/s 的控制器上限目前**跑不满**，卡它的是下面两处，提速别只看控制器：
#       * velocity_smoother@minco 的 max_velocity = 5.0（按分量钳位）——当前真正生效的上限；
#       * planning_horizon = 3.0 m：加速-减速三角剖面的峰值只有 √(a·d)=√(10×3)≈5.5 m/s，
#         局部视野不够时再高的限速也用不上（制动距离 6.0 m/s 下已约 2.7 m，几乎没有余量）。
#
# 改档位的步骤
# ------------
#   1) 只改本文件里的数字（别去改参数文件，那里已经没有这些键了）；
#   2) 跑 `python3 src/srm27_navigation/srm27_nav_bringup/scripts/srm_speed_limits_check.py`
#      —— 它打印各层实际生效值、指出**卡住速度的是哪一层**，并校验
#      "控制器 ≤ 平滑器 ≤ mux" 的单调关系；
#   3) 提速还要一起看：planning_horizon / max_linear_accel（制动距离）、
#      行为树 RemovePassedGoals 的 radius（切弯偏移）、MINCO 的 w_jerk，
#      见 docs/导航速度调试指南.md §6。
#
# 故意不放在这里的东西
# --------------------
#   * 实车串口 srm27_nav_protocol（max_vx/max_vy/max_wz、linear_velocity_scale）——串口那一层；
#   * 手柄 scale_chassis / scale_chassis_turbo —— 手动链路，绕过平滑器；
#   * 行为树 BackUp 的 backup_speed —— 脱困动作，也绕过平滑器；
#   * 弯道降速与前瞻（curvature_*、lookahead_time、corner_speed_ratio、w_jerk）——
#     它们不是硬上限而是"曲线"，留在各自的参数文件里，改动要点见调试指南 §4.3/§4.5/§4.6。

# -----------------------------------------------------------------------------
# 控制器（Omni 变体：nav2_params_srm.yaml）
# -----------------------------------------------------------------------------
controller_server@omni:
  ros__parameters:
    FollowPath:
      v_linear_max: 1.5                 # 平移线速度上限（米/秒），PID 输出的饱和值
      v_linear_min: -1.5                # 平移线速度下限（倒车同理）
      v_angular_max: 1.0                # 自转角速度上限（弧度/秒）；导航 wz 下游恒被钳 0
      v_angular_min: -1.0               # 自转角速度下限
      # ↑ 注意：只抬这里不够，velocity_smoother 与 srm_cmd_mux 会把它压回去。

# -----------------------------------------------------------------------------
# 控制器（MINCO-MPC 变体：nav2_params_srm_minco.yaml）
# 速度层 MPC 的硬约束，同时是"规划器"的速度上限：前端起停剖面按这两个值生成，
# 校验器也按 (1 + 2%) 判定候选轨迹能否执行（超了整条丢弃、车不动）。
# -----------------------------------------------------------------------------
controller_server@minco:
  ros__parameters:
    FollowPath:
      limits:
        max_linear_speed: 6.00          # 平移合速度上限（米/秒）
        max_linear_accel: 10.00         # 平移合加速度上限（米/秒²）
        max_angular_speed: 5.00         # 角速度上限（弧度/秒）；xy_only 阶段实际权限为 0
        max_angular_accel: 4.50         # 角加速度上限（弧度/秒²）；同上

# -----------------------------------------------------------------------------
# 速度平滑器（两个变体各一套：控制器上限不同，平滑器必须分别跟住）
# -----------------------------------------------------------------------------
velocity_smoother@omni:
  ros__parameters:
    max_velocity: [1.5, 1.5, 0.0]       # 最大速度[x,y,yaw]，yaw 钳 0（导航 wz 恒 0）
    min_velocity: [-1.5, -1.5, 0.0]     # 最小速度[x,y,yaw]
    max_accel: [3.0, 3.0, 0.0]          # 最大加速度[x,y,yaw]
    max_decel: [-3.0, -3.0, 0.0]        # 最大减速度[x,y,yaw]

velocity_smoother@minco:
  ros__parameters:
    # 按分量钳位（scale_velocities: False），所以斜向合速度可以到 √2 × 这里的 x 值；
    # 合速度最终由 srm_cmd_mux.v_max 兜底。
    max_velocity: [5.0, 5.0, 5.0]       # 最大速度[x,y,yaw]
    min_velocity: [-5.0, -5.0, -5.0]    # 最小速度[x,y,yaw]
    max_accel: [6.0, 6.0, 6.0]          # 最大加速度[x,y,yaw]
    max_decel: [-6.0, -6.0, -6.0]       # 最大减速度[x,y,yaw]

# -----------------------------------------------------------------------------
# 速度合成 mux（合并进 srm27_chassis_control/config/srm_chassis_control.yaml）
# mux 是 cmd_vel_sim 的唯一发布者、仿真链最后一道钳位；留低就会把速度整个吃掉。
# 下面是两个变体共用的值（必须 ≥ 两个控制器上限里的较大者）；
# 若将来要让某个变体单独收紧，写成 `srm_cmd_mux@minco:` / `srm_cmd_mux@omni:` 即可。
# 注意：mux 的限幅参数**没有**动态回调，改完必须重启。
# -----------------------------------------------------------------------------
srm_cmd_mux:
  ros__parameters:
    vx_max: 5.0                         # 前向速度上限（米/秒，按分量）
    vy_max: 5.0                         # 左向速度上限（米/秒，按分量）
    v_max: 6.0                          # 平移合速度上限（米/秒，按向量模长）
    wz_max: 4.0                         # 自转角速度上限（弧度/秒，取实车串口协议口径）

# -----------------------------------------------------------------------------
# 独立自转链路（同样合并进 srm_chassis_control.yaml）
# 自转不经导航链路、不受上面平滑器与 mux 平移限幅约束，只有这里能限住它。
# -----------------------------------------------------------------------------
rotation_controller:
  ros__parameters:
    wz_max: 2.0                         # 自转角速度上限（弧度/秒）
    max_angular_accel: 0.0              # 自转角加速度上限（弧度/秒²）；0 = 不限制

# -----------------------------------------------------------------------------
# 恢复行为（behavior_server）：Spin 等的自转限幅，四份参数文件里原本都是这三个值。
# 不是导航速度上限，放在这里只是为了"非串口限幅都能一处找到"。
# -----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    max_rotational_vel: 1.0             # 最大旋转速度（弧度/秒）
    min_rotational_vel: 0.0             # 最小旋转速度（弧度/秒）
    rotational_acc_lim: 3.2             # 旋转加速度上限（弧度/秒²）
