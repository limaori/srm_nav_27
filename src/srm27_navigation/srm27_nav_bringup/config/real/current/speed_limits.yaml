# =============================================================================
# 实车速度限幅 —— 唯一来源（single source of truth）
# =============================================================================
#
# 本文件是实车链上**所有非串口限幅**的唯一定义处。启动时由
#   launch/nav2_stack_launch.py（以及实车入口 launch/nav_srm_real_launch.py）
# 合并进下面三份参数文件，合并后各节点收到的就是这里的值：
#   * config/real/nav2_params_srm.yaml                  （Omni 变体）
#   * config/real/nav2_params_srm_minco.yaml            （MINCO 变体）
#   * config/real/nav2_params_srm_minco_fakeyaw.yaml    （MINCO + fakeyaw 迁移链）
# 那些文件里**不再写**这些键：两处都写且值不一致时启动会直接报错
# （见 scripts/srm_speed_limits.py 的冲突检查）。
#
# 实车速度链（2026-11-06 起两条并存，靠参数文件内容区分）：
#   A) 旧链（`@minco` / `@omni`，导航不控自转）：
#      控制器 FollowPath ─cmd_vel_controller─► velocity_smoother ─► cmd_vel_chassis
#                                                    ─► srm27_nav_protocol ─► 串口
#   B) 迁移链（`@fakeyaw`，云台系：导航只出平移 + 决策层 rotation_cmd 走 mux）：
#      控制器 FollowPath ─cmd_vel_nav_fake─► fake_vel_transform ─cmd_vel_nav_body─►
#      srm_cmd_mux ─cmd_vel_chassis─► srm27_nav_protocol ─► 串口
#      `@fakeyaw` 段叠加在 `@minco` 之上（后写优先），只覆盖 smoother 的 yaw 界那几个键
#      （2026-11-08 云台系改造后是**钳 0**：导航只出平移，底盘 wz 走 mux，见该段注释）。
# 串口那一层（max_vx/max_vy/max_wz、linear_velocity_scale）**故意不在这里**：
# 它是最后一道安全限幅，见 srm27_nav_protocol/config/srm27_nav_protocol.yaml。
# ⚠ 串口限幅作用在缩放**之后**，所以实车出口上限 = max_vx 与
#   linear_velocity_scale × 控制器上限 中的较小者——提速时必须一起核对，
#   scripts/srm_speed_limits_check.py 会把这一层一起算出来打印。
# 注（2026-11-04）：srm27_nav_protocol.yaml 的缩放已改回 1.0（原 0.80 / 0.8），
#   串口一层的实际出口上限现在就是 max_vx/max_vy/max_wz = 4.5/4.5/4.0。
#   下面 MINCO 档注释里"3.5 × 0.80 = 2.8"是当时的数值，已不再成立，
#   一律以 yaml 里的实际键值为准。
#
# 语法
# ----
#   * 顶层键 = 参数文件里的节点名；`@minco` / `@omni` 表示只对该控制器变体生效，
#     `@fakeyaw` 表示只在 fakeyaw 迁移链生效（可与 `@minco` **叠加**，后写优先），
#     不带 @ 的段对所有变体生效。
#   * 段内层级与参数文件完全一致（必须带 ros__parameters，否则启动报错）。
#
# 当前档位（2026-11-11）
# ----------------------
#   | 层                       | Omni 变体 | MINCO 变体 | 说明                          |
#   |--------------------------|-----------|------------|-------------------------------|
#   | 控制器平移上限           | 2.60      | 2.60       | 平移合速度，两个变体同档 |
#   | 控制器自转上限           | 8.50      | 8.50       | 实车真正生效的是 mux.wz_max（见下） |
#   | 控制器平移加速度上限     | 无        | 7.00       | Omni 由平滑器承担；同时是验证器制动假设 |
#   | 控制器自转加速度上限     | 无        | 25.0       | 2026-11-11: 4.50 → 25.0；mux 的 wz_ramp 同档 |
#   | 平滑器 max_velocity      | 2.60      | 2.60       | 与控制器齐平；yaw 分量**仍钳 0** |
#   | 平滑器 max_accel         | 7.00      | 7.00       | 与各自控制器齐平，仍会限制短航段 |
#   | 合成 mux（@fakeyaw）     | —         | 2.60 / 8.50 | v_max / wz_max，cmd_vel_chassis 前最后一道 |
#   | 串口（不在本文件）       | 2.60×1.0 = 2.60 | 同左 | 与上面各层齐平，不构成额外瓶颈 |
#   ⚠ 2026-11-11: 平移 0.40 → **2.60 m/s**，自转 1.00 → **8.50 rad/s**（按要求改）。
#     控制器 / 平滑器 / mux / 串口四层齐平，没有谁比谁早一截。
#     ⚠ 这是**上限**，不代表车做得到：8.50 rad/s ≈ 487 °/s ≈ 1.35 r/s。斜率已与 mux 同档
#       放到 wz_ramp = 25.0 rad/s²（srm27_chassis_control/config/srm_chassis_control.yaml）
#       → 0→8.50 只要 0.34 s；下位机固件若有自己的限幅，这一档只会"参数改大了、车转不到"。
#     ⚠ 制动辨识仍未做（safety.braking_deceleration = 0，退化为按 max_linear_accel = 7.0
#       假设刹车）。2.60 m/s 下制动走廊预检能过（余量约 40%），但那是**假设值**不是实测值。
#
# 改档位的步骤
# ------------
#   1) 只改本文件里的数字；
#   2) 跑 `python3 src/srm27_navigation/srm27_nav_bringup/scripts/srm_speed_limits_check.py`
#      —— 打印各层实际生效值、指出卡住速度的层，并校验 "控制器 ≤ 平滑器 ≤ 串口"；
#   3) 上电前再跑实车预检：`ros2 run srm27_nav_bringup srm_minco_real_preflight --params <参数文件>`
#      （它会自动把本文件合并进去，检查制动走廊、分层一致性等）；
#   4) 实车提速前必须做制动与延迟辨识，并按 docs/导航速度调试指南.md §6 逐级提档。
#
# 故意不放在这里的东西
# --------------------
#   * 串口 srm27_nav_protocol 的 max_vx/max_vy/max_wz 与 linear_velocity_scale；
#   * 手柄 scale_chassis / scale_chassis_turbo —— 手动链路，绕过平滑器；
#   * 行为树 BackUp 的 backup_speed —— 脱困动作，也绕过平滑器；
#   * 弯道降速与前瞻（curvature_*、lookahead_time、corner_speed_ratio、w_jerk）。

# -----------------------------------------------------------------------------
# 控制器（Omni 变体：nav2_params_srm.yaml）
# -----------------------------------------------------------------------------
controller_server@omni:
  ros__parameters:
    FollowPath:
      v_linear_max: 2.60               # 平移线速度上限（米/秒），PID 输出的饱和值
      v_linear_min: -2.60              # 平移线速度下限
      v_angular_max: 8.50              # 自转角速度上限（弧度/秒）；导航 wz 恒为 0
      v_angular_min: -8.50             # 自转角速度下限

# -----------------------------------------------------------------------------
# 控制器（MINCO-MPC 变体：nav2_params_srm_minco.yaml）
# 同时是"规划器"的速度硬约束：前端起停剖面与轨迹校验都按这两个值判定。
# 2026-11-11: 平移 0.40 / 自转 1.00 → 2.60 / 8.50（与串口同档，四层齐平）。
# ⚠ 三个必须先读的提醒：
#   1) 实车出口 = min(本档, 串口) —— 串口 max_vx 2.60 × linear_velocity_scale 1.00
#      = **2.60 m/s**；本档若高于它，超出的部分会被串口静默砍掉；
#   2) max_linear_accel 7.0 会同时被验证器当作**制动能力**（safety.braking_deceleration
#      = 0 → 退化用它），即假设车能以 7 m/s² 刹停 —— 实车没做制动辨识前这是乐观假设，
#      表现为"允许了实际停不下来的轨迹"；
#   3) 需与 planning_horizon 3.0 m 一起看：2.60 m/s 的制动距离 ≈ 0.48 m（按 7 m/s²），
#      加反应延迟与车体包络后约 1.07 m，占 horizon 的 36%，预检能过。
# -----------------------------------------------------------------------------
controller_server@minco:
  ros__parameters:
    FollowPath:
      limits:
        max_linear_speed: 2.60         # 平移合速度上限（米/秒）；2026-11-11 提速，串口同档 2.60
        max_linear_accel: 7.0          # 平移合加速度上限（米/秒²）；同时是验证器的制动能力假设
        max_angular_speed: 8.50        # 角速度上限（弧度/秒）；2026-11-11 与串口 max_wz 同档
        max_angular_accel: 25.0        # 角加速度上限（弧度/秒²）；2026-11-11: 4.50 → 25.0，与 mux 的 wz_ramp 同档

# -----------------------------------------------------------------------------
# 速度平滑器（两个变体各一套：控制器上限不同，平滑器必须分别跟住）
# -----------------------------------------------------------------------------
velocity_smoother@omni:
  ros__parameters:
    max_velocity: [2.6, 2.6, 0.0]       # 最大速度[x,y,yaw]，yaw 钳 0（导航 wz 恒 0）
    min_velocity: [-2.6, -2.6, 0.0]     # 最小速度[x,y,yaw]
    max_accel: [7.0, 7.0, 0.0]          # 最大加速度[x,y,yaw]；2026-11-11 与 MINCO 档统一 7.0
    max_decel: [-7.0, -7.0, 0.0]        # 最大减速度[x,y,yaw]

velocity_smoother@minco:
  ros__parameters:
    # 2026-11-11: 与控制器齐平提到 2.60（原 0.4）。
    # yaw 分量**故意保持 0.0**：实车的平滑器出口直连 cmd_vel_chassis → 串口，
    # 一旦有节点往导航出口发 wz，yaw 界放开就会让底盘真的转起来；这是实车执行端
    # 的安全闸（仿真没有这个风险，所以它在仿真里是 5.0）。
    # 需要导航拥有 wz 的是 fakeyaw 迁移链，那一路也仍然钳 0 —— 底盘 wz 只走 mux。
    # 另注意：平滑器按分量钳位，所以 x 给 2.6 时斜向合速度可达 √2×2.6 ≈ 3.68；
    # 但下游 srm_cmd_mux 的 v_max 按**模长**再钳一次，实车出口仍是 2.60 m/s。
    max_velocity: [2.6, 2.6, 0.0]       # 最大速度[x,y,yaw]
    min_velocity: [-2.6, -2.6, 0.0]     # 最小速度[x,y,yaw]
    max_accel: [7.0, 7.0, 0.0]          # 最大加速度[x,y,yaw]
    max_decel: [-7.0, -7.0, 0.0]        # 最大减速度[x,y,yaw]

# -----------------------------------------------------------------------------
# 迁移链（fakeyaw，`config/real/nav2_params_srm_minco_fakeyaw.yaml`）
# 叠加在 `velocity_smoother@minco` 之上：平移档不动，只钉住"导航这一路不许出 wz"。
# -----------------------------------------------------------------------------
velocity_smoother@fakeyaw:
  ros__parameters:
    # 2026-11-08（方案 §4.2）：云台系下导航只出平移，yaw 界钳 0。
    # 底盘 wz 改由**决策层**发 rotation_cmd，在 srm_cmd_mux 里合进输出（方案 §4.3），
    # 不经过平滑器。这一层因此是"导航漏出 wz"的最后一道上游闸：
    # 界钳 0 之后平滑器任何 yaw 都会被削成 0，mux 还会再忽略一次并计数告警。
    # ⚠ 仿真里它仍是 6.0（仿真链由 MINCO 出 wz，见 config/simulation/speed_limits.yaml）。
    max_velocity: [2.6, 2.6, 0.0]
    min_velocity: [-2.6, -2.6, 0.0]
    max_accel: [7.0, 7.0, 0.0]
    max_decel: [-7.0, -7.0, 0.0]

# -----------------------------------------------------------------------------
# 速度合成 mux（合并进 srm27_chassis_control/config/srm_chassis_control.yaml）
# 迁移链的最后一道钳位，也是 cmd_vel_chassis 的**唯一发布者**：
#   fake_vel_transform ─cmd_vel_nav_body─┐
#                                        ├─► srm_cmd_mux ─cmd_vel_chassis─► 串口节点
#   决策层 rotation_cmd ────────────────┘
# 旧链（@minco 不带 fakeyaw、@omni）**不经过** mux，这些值对它们无效。
# ────────────────────────────────────────────────────────────────────────────
# 平移档：与串口上限同档（2.60），这样 mux 不会成为比串口更早生效的瓶颈。
# 自转档：wz 现在**只**来自决策层的 rotation_cmd（导航那一路会被忽略），
#   wz_max 是它唯一的上限闸（下游还有串口 max_wz=8.5）。
#   ⚠ 8.50 只是上限；mux 内还有 wz_ramp = 4.5 rad/s² 的斜率限制（见
#   srm27_chassis_control.yaml），所以要 1.9 s 才能加到顶。
#   注意 mux 的限幅参数**没有**动态回调，改完必须重启节点。
# -----------------------------------------------------------------------------
srm_cmd_mux:
  ros__parameters:
    vx_max: 2.60                        # 前向速度上限（米/秒，按分量）
    vy_max: 2.60                        # 左向速度上限（米/秒，按分量）
    v_max: 2.60                         # 平移合速度上限（米/秒，按向量模长）
    wz_max: 8.50                        # 自转角速度上限（弧度/秒）—— 2026-11-11 提速

# -----------------------------------------------------------------------------
# 恢复行为（behavior_server）：Spin 等的自转限幅，两份参数文件里原本都是这三个值。
# 不是导航速度上限，放在这里只是为了"非串口限幅都能一处找到"。
# -----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    max_rotational_vel: 1.0             # 最大旋转速度（弧度/秒）
    min_rotational_vel: 0.4             # 最小旋转速度（弧度/秒）
    rotational_acc_lim: 3.2             # 旋转加速度上限（弧度/秒²）
