# ZLIO 前端算法配置（SRM27 **实车**专用）
#
# 来源：z-localization 的 config/lio.yaml（72 项，与仿真那份同一套键），
# **只**改下面这几项，依据见 docs/仿真LIO前端替换Z-LIO实施方案(ai).md §5（仿真/实车对账表）
# 与 docs/仿真链迁移实车实施记录(ai).md。
#
# ★ 硬性约束（与仿真那份相同）：z-loc 的 loadConfig() 对未知键直接抛异常（启动即失败），
#   所以本文件不得新增任何 z-loc 不认识的键；改动只能改值。
#   新增/调整前先对照 src/frontend/docs/parameters.md 与 src/frontend/src/config.cpp。
#
# 该文件只是**算法参数**；输入接线（话题/消息格式/IMU 单位/帧名）在 launch 里：
#   nav_srm_real_launch.py 会传 zlio_input_type:=livox、zlio_lidar_topic:=livox/lidar、
#   zlio_imu_acceleration_scale:=9.81、zlio_body_frame:=livox_imu。
#
# 与仿真那份的差异（每一条都是坑）
# ==============================
# 1) sensor.body_from_lidar.translation = [-0.011, -0.02329, 0.04412]
#    这是 MID-360 的 lidar → IMU 平移，与实车 point_lio.extrinsic_T 同源
#    （config/real/nav2_params_srm_minco.yaml 的 point_lio.mapping.extrinsic_T）。
#    语义同样是"雷达原点在 IMU 系中的坐标"，不是"IMU 在雷达系中的坐标"。
#    ⚠ 仿真那份是 [0, 0, 0.03]（gpu_lidar 相对 link 的 3 cm），别抄过来。
# 2) initialization.window_frames = 10
#    实车雷达 publish_freq = 10 Hz（config/real 的 livox_ros_driver2 段）→ 1.0 s 初始化窗口。
#    仿真雷达 20 Hz，那份写 20。
# 3) window.maximum_interval = 0.25
#    必须**大于**雷达周期（实车 0.10 s），留 2~3 帧余量；仿真那份是 0.12（周期 0.05）。
#    给小于周期会让每帧都被判"观测间隔过长"，前端反复走初始化分支。
# 4) 其余（seed_imu_samples=31 对应 200 Hz IMU、gravity 模长 9.81、blind/量程、filter/map/
#    sampling 全部）保持与仿真那份一致：先把"输入接线 + 三处频率/外参"当作唯一自变量。
#
# 注意 gravity：本文件写的是**模长**（9.81），不是向量。实车雷达是斜装
#   （实测 roll **-30°**，见 point_lio.mapping.gravity=[0,+4.905,-8.496]），方向由前端
#   在初始化时自己估计；不要因为实车 gravity 向量非零就往这里塞向量。
#   ⚠ 这里只要模长，所以 URDF 的 lidar_roll **符号写反也不会在本文件暴露** —— 但
#     zlio_bridge 的 T_off = TF(gimbal_yaw←livox_imu)·R_0⁻¹ 会把模型误差原样保留：
#     2026-11-13 之前 URDF 写成 +30°（真实 -30°），point_lio 靠 gravity 初始化吸收掉了，
#     zlio 的整片点云则歪了 60°（首帧 R_0 被抵消，剩下的是模型与真实的差）。

# 传感器参数。
sensor:
    # 固定重力模长，m/s²。仿真 IMU 输出单位是 m/s²，故 gravity 就是 9.81。
    gravity: 9.81
    # 有效测距下限，m。= point_lio 的 blind: 0.3（2026-11-06: 0.5 -> 0.46 -> 0.3，两套前端必须同值）。
    minimum_range: 0.3
    # 有效测距上限，m。
    maximum_range: 100.0
    # 将雷达坐标转换到 IMU 坐标的刚性外参。
    body_from_lidar:
        # 外参旋转四元数，按 x、y、z、w 排列。实车 extrinsic_R 为对角单位阵（无旋转）。
        rotation_xyzw: [0, 0, 0, 1]
        # MID-360 雷达原点在 IMU 系中的位置，m（见文件头差异说明 1）：
        # = 实车 point_lio.mapping.extrinsic_T。
        translation: [-0.011, -0.02329, 0.04412]

# 初始化参数。
initialization:
    # IMU 系加速度偏置初值及先验中心，m/s²。
    accel_bias: [0, 0, 0]
    # 加速度偏置先验各轴标准差，m/s²。
    accel_bias_std: [0.3, 0.3, 0.3]
    # 参与启动联合估计的扫描帧数。实车 10 Hz 下 = 1.0 s 初始化窗口。
    window_frames: 10
    # 重力方向初猜所需的 IMU 样本数。200 Hz 下 = 0.155 s。
    seed_imu_samples: 31
    # 重去畸变与优化的交替轮数上限。
    maximum_refinements: 15
    # 原始回波采样体素边长，m。
    sample_size: 0.1
    # 支持不足时的采样体素边长，m。
    fallback_sample_size: 0.05
    # 触发细采样的点数界限。
    minimum_sampled_points: 1000
    # 最弱方向的平面法向支撑下限，无量纲。
    minimum_directional_support: 15
    # 粗／细阶段的相对代价变化收敛限值。
    relative_cost_tolerance: [0.05, 0.01]
    # 启动粗配准与临时惯性传播参数。
    registration:
        # 配准质心网格边长，m。
        voxel_size: 0.5
        # 局部平面拟合的最近邻点数。
        neighbors: 5
        # 开始粗配准所需的地图点数。
        minimum_map_points: 100
        # 每帧粗配准迭代上限。
        maximum_iterations: 4
        # 平面方程 A·n=-1 的无量纲拟合残差限值。
        plane_residual_tolerance: 0.1
        # 粗配准先验协方差的放大系数。
        prior_covariance_scale: 1000
        # 旋转增量收敛限值，rad。
        rotation_tolerance: 0.00017452006980802793
        # 位置增量收敛限值，m。
        position_tolerance: 0.00015
        # 粗传播角速度有效方差，rad²/s²。
        gyro_variance: 0.1
        # 粗传播比力有效方差，m²/s⁴。
        accel_variance: 1
        # 原始 IMU 区间内两偏置变化率的有效方差。
        bias_variance: 0.0001
        # 粗启动状态及暖重置新位置、航向的各轴先验方差，使用各自 SI 单位。
        initial_state_variance: 0.0001
        # 粗启动两偏置的各轴先验方差，使用各自 SI 单位。
        initial_bias_variance: 0.00001
    # 启动窗口的几何与惯性优化参数。
    optimization:
        # 联合优化根体素边长，m。
        voxel_size: 1
        # 平面体素最大细分深度。
        maximum_depth: 2
        # 超过该支持点数后拟面。
        minimum_points: 5
        # 启动优化所需的平面数下限。
        minimum_planes: 10
        # 粗／细阶段的法向散布方差上限，m²。
        plane_variance: [0.02, 0.0025]
        # 最小／最大散布特征值比例上限。
        plane_eigenvalue_ratio: 0.25
        # 最小／中间散布特征值比例上限。
        plane_middle_ratio: 0.12
        # IMU 代价相对几何代价的有效权重。
        imu_weight: 0.0001
        # 启动几何求解线程数。
        thread_count: 5
        # 单次联合优化的下降步数上限。
        maximum_iterations: 3
        # 预积分角速度有效方差，rad²/s²。
        gyro_variance: 0.01
        # 预积分比力有效方差，m²/s⁴。
        accel_variance: 1
        # 预积分陀螺偏置随机游走强度，rad²/s³。
        gyro_bias_psd: 0.0001
        # 预积分加速度偏置随机游走强度，m²/s⁵。
        accel_bias_psd: 0.0001
    # 初始状态不确定度参数。
    uncertainty:
        # 联合信息通过验收后，允许协方差数值恢复失败时使用配置方差。
        allow_configured_fallback: true
        # 位置、左旋转、速度及两偏置的各轴配置方差，使用对应 SI 单位。
        state_variance: [1, 1, 1, 0.0001, 0.001]

# 运行滤波参数。
filter:
    # 点面关联线程数，包含主线程。
    association_threads: 2
    # 单次观测更新的最大迭代次数。
    maximum_iterations: 5
    # 导航状态变化的收敛限值，使用对应 SI 单位。
    convergence_tolerance: 0.001
    # 原始 IMU 区间的角速度有效方差，rad²/s²。
    gyro_variance: 0.25
    # 原始 IMU 区间的比力有效方差，m²/s⁴。
    accel_variance: 0.5
    # 陀螺偏置随机游走强度，rad²/s³。
    gyro_bias_psd: 0.00000133
    # 加速度偏置随机游走强度，m²/s⁵。
    accel_bias_psd: 0.0000215

# 平面地图参数。
map:
    # 地图根体素边长，m。
    voxel_size: 0.5
    # 地图根体素数量上限。
    maximum_roots: 1000000
    # 径向测距标准差，m。
    range_sigma: 0.02
    # 切向角度标准差，度。
    angle_sigma_degrees: 0.05

# 自适应采样参数。
sampling:
    # 初始采样体素边长，m。
    initial_size: 0.25
    # 采样体素边长下限，m。
    minimum_size: 0.02
    # 采样体素边长上限，m。
    maximum_size: 1.0
    # 场景尺度平滑所用的历史观测数。
    history_size: 5
    # 目标采样点数下限。
    minimum_points: 1000
    # 目标采样点数上限。
    maximum_points: 4000
    # 距离中位数的尺度归一化长度，m。
    scale_threshold: 30.0
    # 场景尺度到目标点数的映射指数。
    exponent: 2.0
    # 比例项的相对点数误差尺度。
    proportional_scale: 0.1
    # 微分项的相对误差变化尺度。
    derivative_scale: 0.2
    # 比例增益下限，m/点。
    proportional_minimum: 0.000001
    # 比例增益上限，m/点。
    proportional_maximum: 0.0001
    # 微分增益下限，m·s/点。
    derivative_minimum: 0.000000001
    # 微分增益上限，m·s/点。
    derivative_maximum: 0.0000001

# 观测间隔调度参数。
window:
    # 观测间隔及采样历史跨度上限，s。必须大于雷达周期 0.10，10 Hz 下 0.25 留了 2.5 帧。
    maximum_interval: 0.25
    # 观测间隔下限，s。
    minimum_interval: 0.03
    # 点面噪声归一化后的局部运动外推 RMS 预算。
    normalized_error: 2.0
