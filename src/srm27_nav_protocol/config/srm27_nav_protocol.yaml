/srm27_nav_protocol:
  ros__parameters:
    device_name: /dev/ttyACM0
    baud_rate: 115200
    flow_control: none
    parity: none
    stop_bits: "1"

    # ---- 协议 §6.1 定频发送 ----
    # 上→下 固定 19 字节单帧 (data_length=12)。推荐 100 Hz;
    # 19 字节在 115200 baud 下约 1.65 ms, 100 Hz 留出的空闲足够 (§6.2)。
    # 上限 200 Hz (超过就没有帧间空闲, 代码会直接报错)。
    send_rate_hz: 100.0

    # ---- 协议 §6.3 看门狗 ----
    # cmd_vel 超过这么久没更新就把控制量归零, 避免"底盘按最后一帧一直跑"。
    # 协议建议 500 ms。
    cmd_timeout_sec: 0.5

    # ---- 协议 §6.5 上位机自己限幅 ----
    # 协议层不限幅, 限幅是上位机的责任。默认值取 nav2 omni 控制器自身的
    # 输出上限 (v_linear_max=0.5 / v_angular_max=1.0), 这样正常导航不会被
    # 静默削掉; 如果要按 §3.3 的保守值起步调试, 改成 0.2 即可。
    max_vx: 2.5
    max_vy: 2.5
    max_wz: 1.0

    # ---- 速度对齐 (指令值 ≠ 实际速度的尺度修正) ----
    # 发往下位机之前把收到的指令乘这个系数。1.0 = 原行为(不缩放)。
    #
    # 为什么需要: 2026-10-09 实车录包实测 (/cmd_vel_chassis 与 /odometry 的
    # 稳态差商对比, 278 个样本):
    #     实际速度 / 指令值 = 1.263 (中位; 0.4~0.7 档 1.327, 0.7~1.0 档 1.249,
    #     1.0~1.3 档 1.245) —— 各速档基本一致, 说明是**尺度**不一致而不是动态误差。
    #     即指令 1.24 m/s 时车实际跑 1.55 m/s (全段峰值 1.66)。
    # 后果不止"跑得快": MINCO 的轨迹校验硬门槛是 limits.max_linear_speed × 1.02 = 1.53,
    # 而轨迹的**起点速度是当前实测速度**这个硬边界条件 —— 实测 1.536 时任何候选轨迹
    # 都必然超限, 整条被判死、控制器输出零速, 现场就是"一顿一顿 + 轨迹跳变"。
    # 修法见 log_diag/real_bag_2026-10-09_22-13-51/REPORT.md §2.1。
    #
    # 取值: 0.8 ≈ 1/1.263, 即把指令压到"车实际跑出来正好等于指令值"。
    # 注意它同时会掩盖上游的尺度问题(LIO 尺度或底盘换算), 这只是先让闭环自洽;
    # 定性要靠卷尺实测 /odometry 位移。改回 1.0 即恢复原行为, 不用改代码。
    linear_velocity_scale: 0.80
    # 角速度目前没有实测依据(本轮只对齐平移), 保持 1.0 不动。
    angular_velocity_scale: 1.0

    # ---- 诊断开关 ----
    # 打开后终端会打印收发两端的原始 hex:
    #   RECV ...  <- 从下位机收到的整包 (一条都不出现说明底盘完全没回传)
    #   SEND ...  <- 实际发往下位机的 19 字节整包, 用于对照协议 §5 参考向量
    # 注意它对定频心跳有影响 (§6.6), 排查完请改回 false。
    debug_print_hex: false
