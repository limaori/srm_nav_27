# 本工作区实车先验地图定位 profile。
#
# 只覆盖“跑起来需要的接线”，算法参数一律沿用 backend.yaml（上游基线），
# 便于把算法调参与工程接线分开评审。
extends: backend.yaml

common:
  # 实车 ZLIO 的 body_frame 是 livox_imu（见 nav2_params_srm_minco_fakeyaw.yaml 的
  # zlio_bridge.lidar_frame）。后端逐帧校验
  # `odometry.child_frame_id == common.sensor_frame`，写错会静默丢帧。
  sensor_frame: livox_imu
  scan_context:
    # 2026-11-24：先验地图 219_1121 按地面平面摆正（scripts/mapping/level_map_pcd.py），
    # 地面在 map z=0，雷达离地 = gimbal_yaw 0.2681 + livox 0.0285 = 0.2966 m。
    # 必须与地图包建包时的 --sensor-z/--sc-lidar-height 逐位一致：
    # storage.cpp 按 1e-6 比较，改这里必须重建 bundle，否则启动 FATAL
    # “failed to load Scan Context descriptors”。（backend.yaml 保持上游基线 0.3464，
    # 仿真 profile 不受影响；219_1121 与 227_1113pro 两个实车 bundle 都已按 0.2966 重建。）
    lidar_height: 0.2966

output:
  # 实车 Nav2 是 2D：local_costmap 在 odom、global_costmap 在 map。odom 是"出生时
  # gimbal_yaw"系，出生姿态的 roll/pitch 会原样带进 map→odom，导致两张 costmap
  # 不共面（2026-11-24 实测 z 已由先验地图摆正降到 ~0，但 roll/pitch 仍有 ~1.4°/2.4°）。
  # 打开 4-DoF 投影后 TF 只保留 x/y/yaw，两张 costmap 共面；内部估计仍是 6-DoF。
  planar_map_to_odom: true

recovery:
  # ★ 2026-11-26 实车复盘（bag real_zloc_1126_215042 / 21:30 那次）：
  #
  # 上游把恢复搜索压到 2 m 靠的是 UWB（uwb.recovery_search_radius: 2.0）。本车没有 UWB，
  # 恢复退化成"围绕最后可信位姿 30/35 m 的全局描述子检索"，而 227/219 两段走廊同构、
  # 相距约 45 m —— Scan Context 的 180° 混叠以 rmse 0.084 / corr 0.83 的"好成绩"通过验收，
  # 一次提交就把车传送十几米（实测 +45.2 / +11.4 / +30.4 m，其中两次还被 6 s 后反向弹回）。
  #
  # 这里按"上游 UWB 的等效尺度"收紧，把那条不变式在没有 UWB 的情况下补回来：
  #   1) 可信位姿的实测漂移在 1–2 m 内，SUSPECT 半径 5 m 足够召回正确候选；
  #   2) LOST 的 12 m 覆盖一段走廊，但不会跨到另一段同构走廊；
  #   3) LOST 后不自动乱找，保持冻结等人工 /backend_node/relocalize；
  #   4) 幅度预算 2.5 m / 20° 是最后一道闸（见 backend.yaml 同名键）。
  suspect_search_radius: 5.0
  lost_search_radius: 12.0
  automatic_when_lost: false
  # 与 backend.yaml 默认值相同，写在这里是为了让"实车只看这一份"也能看到闸门在哪。
  max_translation_correction: 2.5
  max_rotation_correction_deg: 20.0
  # 车被搬动/推走超过预算时，先调大上面两项或手动 relocalize（人工请求默认绕过预算）。

correction_anchor:
  # ★ 2026-11-27 实车：换 227to219_1125 后 map→odom 会**跳**（不是缓慢漂），
  #   状态机上对应 SUSPECT/LOST → "recovered via Scan Context + scan-to-map"。
  #   根因是这张图 51×82 m、1960 关键帧，且描述子实测已不可分（任意两处距离≈0.000，
  #   见 debug_tools/check_sc_separability.py），检索本质上是随机挑候选。
  #
  #   逐次上限（上面 2.5 m / 20°）拦不住"跳一次 20°、再跳一次"，所以这里再叠一道
  #   **累计**闸：相对不随错误移动的锚点，累计旋转不超过 8°、累计平移不超过 0.8 m。
  #   越界的恢复不提交，TF 保持冻结（宁可"停住等人"，不要"转过去再错"）。
  enabled: true
  max_rotation_deg: 8.0
  max_translation: 0.8
  # 单次修正 <= 1° / 0.15 m 算"安静"；连续 5 帧安静才让锚点前移，
  # 这样"跳一次 → 安静一帧 → 再跳一次"的锯齿也没法把锚点追认过去。
  reseat_rotation_deg: 1.0
  reseat_translation: 0.15
  reseat_quiet_frames: 5
  #
  # ↓ 一致证据放行（2026-11-27 19:39 包 real_zloc_1127_193946 之后补的出口）
  #
  # 现场数据：47.3 s 起连续 7 次先验观测都报 delta_t=1.17~1.28 m / delta_r=3.4~3.7°
  # （彼此只差 5 cm / 0.3°），全部被上面 0.8 m 的锚点拒；7 连冲突 → SUSPECT → LOST，
  # 之后 70 s 内跟踪和恢复都被同一道闸拒，0 次提交，包尾点云相对先验图歪 1.8 m / ≥9.5°。
  # 绝对预算没有出口就是死锁，所以给"连续一致"的候选一条有界放行通道。
  release_enabled: true
  # 5 帧 × 2 Hz = 2.5 s，比 conflicts_before_suspect=7 先到，赶在 SUSPECT 之前放行。
  release_frames: 5
  # 一致判据：相邻两次越界候选的差。实测同一个错解只有 5 cm / 0.3° 的抖动，
  # 取 12 cm / 1° 既容得下抖动，又容不下"每帧长 1.5°"的积分饱和。
  release_agree_translation: 0.12
  release_agree_rotation_deg: 1.0
  # 放行半径：<= 恢复单次闸的 2.5 m，且远小于 2026-11-26 那几次传送（+45/+11/+30 m）。
  release_max_translation: 1.6
  release_max_rotation_deg: 10.0

tracking:
  # 云台快速自转时跳过先验观测（2026-11-27 实测：150°/s 时预测与观测差 0.2~0.5 m，
  # 旋转只差 0.3°，NIS 88~326，连 7 次冲突就冻结；收窄累积窗口无效）。
  # 跳过不计冲突，状态保持 NORMAL，转完自动恢复纠偏。
  # 60°/s 的取法：正常跟踪时车体角速度在 10~20°/s 量级，留 3 倍余量；
  # 自转测试经常打到 150~265°/s，都在这道闸之上。
  max_body_angular_rate_deg: 60.0
  source:
    # ★ 2026-11-27 实车（bag real_zloc_1127_152802）：云台一转到 ~150°/s，先验 scan-to-map
    #   就整片 NIS 爆表（NIS=133~162 / 6 DoF，p≈1e-26），连续 7 次冲突后 37.8 s 冻结。
    #   静止时同一套配置 277 次观测全部接受 —— 问题不在图，在**自转时的累积窗口**。
    #
    #   原值 0 = 不限制：`max_time: 0.5` × 150°/s = 75°，一次配准要把 5 帧、横跨 75° 的
    #   旋转堆进同一个源点云，运动补偿全靠 odom，转速一高误差被放大 → 配准解偏 → NIS 爆。
    #   限到 20° 后，150°/s 时只累积 1~2 帧（≤16°），源点云不再糊。
    max_rotation_deg: 20.0

recovery:
  source:
    # 同上：恢复路径的累积窗口也要收，否则 SUSPECT 里构造的源点云同样是糊的。
    max_rotation_deg: 20.0
