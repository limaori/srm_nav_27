      planning_deadline_ms: 30.0
      state_timeout: 0.5
      map_timeout: 0.3
      trajectory_max_age: 0.3
      build_grace_period: 1.0
      diagnostics_period: 0.5
      publish_visualization: true
      terminal_reached_radius: 0.2
      goal_change_tolerance: 0.1
      terminal:
        enabled: true
        tolerance: 0.0
        exit_margin: 0.15
      state:
        max_sample_gap: 0.4
        max_position_jump: 0.75
        max_yaw_jump: 1.2
        velocity_filter_alpha: 0.35
      minco:
        polynomial_order: 5
        two_stage_optimization: true
        enable_report_fine_heuristic: false
        nominal_piece_duration: 0.3
        min_piece_duration: 0.05
        max_piece_duration: 1.0
        pre_time_ratio_min: 0.9
        pre_time_ratio_max: 1.1
        samples_per_piece: 8
        max_iterations: 150
        gradient_tolerance: 0.0001
        lbfgs_past: 3
        w_jerk: 0.0
        w_time: 25.0
        w_obstacle: 500.0
        w_velocity: 60.0
        w_acceleration: 300.0
        w_time_ratio: 1.0
        soft_hinge_beta: 20.0
        optimization_clearance_margin: 0.1
        resample_step: 0.1
        corner_speed_ratio: 0.8
        min_pieces: 2
        max_pieces: 12
        terminal_speed: 0.8
      mpc:
        model: velocity_integrator
        prediction_dt: 0.02
        prediction_steps: 30
        two_pass_reference: false
        command_lookahead: 0.04
        qp_deadline_ms: 5.0
        use_hot_start: true
        q_position: 20.0
        q_yaw: 5.0
        q_velocity: 1.0
        q_omega: 0.5
        r_translation: 1.0
        r_angular: 1.0
        r_input_change: 0.0
        use_tangent_normal_weight: false
        q_along_track: 20.0
        q_cross_track: 40.0
        speed_polygon_sides: 8
        enforce_input_change: true
      yaw_policy:
        mode: xy_only
        stop_rotation_on_goal: true
        narrow_clearance_threshold: 0.6
        allow_reverse: true
      spin_request:
        topic: rotation_cmd
        timeout: 0.25
      safety:
        robot_radius: 0.33
        clearance_margin: 0.05
        unknown_is_obstacle: true
        braking_deceleration: 0.0
        reaction_latency: 0.1
      recovery:
        fail_threshold: 10
        cooldown_sec: 2.0
        window_sec: 3.0
        escape_speed: 1.0
        stuck_clearance: 0.4
        escaped_clearance: 0.5
        search_radius: 0.4
        search_samples: 36
        repeat_guard_radius: 0.35
        repeat_guard_angle_deg: 120.0
